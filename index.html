<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>gitcity — your GitHub year as a 3D city</title>
    <meta
      name="description"
      content="Turn any GitHub contribution graph into a living 3D neon city. Explore it, theme it, save a PNG, or export an STL and print it."
    />
    <meta name="theme-color" content="#05060d" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="gitcity — your GitHub year as a 3D city" />
    <meta
      property="og:description"
      content="Turn any GitHub contribution graph into a living 3D neon city. Explore it, theme it, save a PNG, or export an STL and print it."
    />
    <meta property="og:image" content="preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a12'/%3E%3Crect x='6' y='17' width='4' height='9' fill='%230091a7'/%3E%3Crect x='12' y='10' width='4' height='16' fill='%231fd8c8'/%3E%3Crect x='18' y='14' width='4' height='12' fill='%239dfff0'/%3E%3Crect x='24' y='20' width='3' height='6' fill='%2300506b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="vignette" aria-hidden="true"></div>

    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="brand-text">
        <h1>gitcity</h1>
        <p>a GitHub year, rendered as a skyline</p>
      </div>
    </header>

    <main class="panel" id="panel">
      <form class="row search" id="form">
        <label class="sr-only" for="user">GitHub username</label>
        <input
          id="user"
          name="user"
          type="text"
          placeholder="github username"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        />
        <button class="go" type="submit" id="go" aria-label="Build city">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M5 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <div class="row">
        <label class="sr-only" for="range">Time range</label>
        <select id="range"></select>
      </div>

      <div class="themes" id="themes" role="group" aria-label="Theme"></div>

      <dl class="stats" id="stats" hidden>
        <div><dt>Contributions</dt><dd id="s-total">—</dd></div>
        <div><dt>Best day</dt><dd id="s-best">—</dd></div>
        <div><dt>Longest streak</dt><dd id="s-streak">—</dd></div>
        <div><dt>Active days</dt><dd id="s-active">—</dd></div>
      </dl>

      <p class="msg" id="msg" hidden></p>
    </main>

    <nav class="actions">
      <button id="a-png" title="Save a PNG of the current view">PNG</button>
      <button id="a-stl" title="Export a printable STL model">STL</button>
      <button id="a-share" title="Copy a link to this city">Share</button>
      <button id="a-reset" title="Reset the camera">Reset</button>
    </nav>

    <div class="hint" id="hint">drag to orbit · scroll to zoom · hover a day</div>

    <div class="tooltip" id="tooltip" hidden></div>
    <div class="toast" id="toast" hidden></div>

    <a class="ghlink" href="https://github.com/aprilNH7/gitcity" target="_blank" rel="noopener" aria-label="Source on GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
